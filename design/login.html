<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meridian | Sign in</title>
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body>
        <div class="login-screen">
            <svg class="login-ambient-arc" viewBox="0 0 200 110">
                <path d="M10, 100 A90, 90 0 0 1 190,100" fill="none" stroke="var(--muted-orange)" stroke-width="1"/>
            </svg>
            <div class="login-content">
                <h1 class="login-watermark">Meridian</h1>
                <p class="login-tagline">
                    Where possibility runs deep, one module at a time. Complete your CPD at your own pace.
                </p>
                <button class="ms-signin-btn">
                    <svg class="ms-logo" viewBox="0 0 21 21">
                        <rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" 
                        fill="#00a4ef"/><rect x="11" y="11" witdh="9" height="9" fill="ffb900"/>
                    </svg>
                    Sign in with Microsoft
                </button>
                <p class="login-note">
                    Uses your Optimum Microsfot account. No separate Meridian password required.
                </p>
            </div>
            <p class="login-footer">
                OPTIMUM FINANCIAL SERVICES GROUP · MERIDIAN CPD
            </p>
        </div>
    </body>
</html>
