<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <script>
        /* Motion flags before first paint (css/frost.css + js/motion.js): mx-js enables the reveal;
           mx-lite gives phones and weaker devices a lighter frost with no drifting light. */
        (function (d, n) {
            d.classList.add("mx-js");
            var c = n.connection || {}, small = window.matchMedia("(max-width: 760px)").matches;
            if (small || c.saveData || (n.hardwareConcurrency && n.hardwareConcurrency <= 4) || (n.deviceMemory && n.deviceMemory <= 4))
                d.classList.add("mx-lite");
        })(document.documentElement, navigator);
    </script>

    <title>Meridian CPD</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/surveys.css" />
    <link rel="stylesheet" href="css/frost.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="css/pb-login.css?v=1" />
    <link rel="stylesheet" href="Meridian.Client.styles.css" />

    <style>
        /* Boot screen: shown while the app downloads. The bar follows Blazor's real load progress. */
        .boot-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
            background: radial-gradient(ellipse 85% 640px at 50% 0%, #153741 0%, rgba(21,55,65,0) 100%), #082024;
            font-family: "Trebuchet MS", sans-serif; animation: boot-in .4s ease-out both; }
        .boot-tile { width: 64px; height: 64px; border-radius: 17px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #2F5D64, #153741); border: 1px solid rgba(248,153,57,.4); box-shadow: 0 0 32px -8px rgba(248,153,57,.55); }
        .boot-arc { stroke-dasharray: 52; stroke-dashoffset: 52; animation: boot-draw 1.4s cubic-bezier(.16,1,.3,1) .1s forwards; }
        .boot-sun { opacity: 0; animation: boot-sun .6s cubic-bezier(.16,1,.3,1) 1s forwards; }
        .boot-text { color: #D7DDE0; font-size: 14px; letter-spacing: .02em; }
        .boot-bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
        .boot-bar span { display: block; height: 100%; width: var(--blazor-load-percentage, 8%); min-width: 8%;
            background: linear-gradient(90deg, #E46434, #F89939); border-radius: 3px; transition: width .3s ease-out; }
        @keyframes boot-in { from { opacity: 0; } }
        @keyframes boot-draw { to { stroke-dashoffset: 0; } }
        @keyframes boot-sun { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .boot-screen, .boot-arc, .boot-sun { animation: none; stroke-dashoffset: 0; opacity: 1; } }
    </style>
</head>

<body>

    <div id="app">
        <div class="boot-screen" role="status">
            <div class="boot-tile" aria-hidden="true">
                <svg viewBox="0 0 48 48" width="42" height="42">
                    <path class="boot-arc" d="M8,34 A16,16 0 0 1 40,34" fill="none" stroke="#F89939" stroke-width="3.4" stroke-linecap="round" pathLength="52" />
                    <circle class="boot-sun" cx="24" cy="18" r="3.8" fill="#E46434" />
                    <path d="M15,38 V27 L24,33 L33,27 V38" fill="none" stroke="#FBFBF9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
                </svg>
            </div>
            <span class="boot-text">Loading Meridian…</span>
            <div class="boot-bar" aria-hidden="true"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error occurred.
        <a href="." class="reload">Reload</a>
    </div>

    <script>
        window.meridianDownloadFile =
            (fileName, contentType, base64Data) => {

                const link =
                    document.createElement("a");

                link.download = fileName;

                link.href =
                    `data:${contentType};base64,${base64Data}`;

                document.body.appendChild(link);

                link.click();

                document.body.removeChild(link);
            };
    </script>

    <script src="js/motion.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>


</body>
</html>
